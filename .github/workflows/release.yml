name: Release

# Builds a universal (arm64 + x86_64) `librime-llm-rerank.dylib` binary
# artifact and attaches it to a GitHub Release. The build pins the exact
# librime source revision and prebuilt dependency set that
# Habit130/squirrel's `action-install.sh` consumes, so the artifact is ABI
# compatible with the librime 1.17.0 runtime bundled by Squirrel by
# construction (same commit, same headers, same plugin build options as
# librime's own `make release`).
#
# Before upload the job runs the applicable C++, daemon, and eval suites
# and rejects a thin dylib. A failed gate skips Create Release.
#
# Squirrel downloads the artifact by release tag and verifies its sha256;
# see the pins at the top of this file and squirrel's `action-install.sh`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      # librime revision to build against (mirrors squirrel submodule pin +
      # action-install.sh's rime_git_hash). Prebuilt deps are pulled from this
      # same librime release, so we never run librime's `make deps`.
      RIME_GIT_HASH: "33e7814"
      RIME_GIT_SHA: "33e78140250125871856cdc5b42ddc6a5fcd3cd4"
      RIME_RELEASE_TAG: "1.17.0"
      RIME_DEPS_ARCHIVE: rime-deps-33e7814-macOS-universal.tar.bz2
      RIME_DEPS_SHA256: "dfe6047e87be271963d7466bd1a6e3d9e660c30e5e73e4bb94e8782c0a6ac8df"
      PREDICT_GIT_SHA: "920bd41ebf6f9bf6855d14fbe80212e54e749791"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      NUMPY_PIN: "2.2.6"
      PYPINYIN_PIN: "0.55.0"
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.5'

      - name: Checkout plugin source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout librime at pinned revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: rime/librime
          ref: ${{ env.RIME_GIT_SHA }}
          path: librime
          submodules: recursive

      - name: Checkout librime-predict (C++ test dependency)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: rime/librime-predict
          ref: ${{ env.PREDICT_GIT_SHA }}
          path: librime/plugins/predict

      - name: Install checksummed Boost headers
        working-directory: librime
        run: |
          ./install-boost.sh --download
          boost_root="$(echo "${PWD}"/deps/boost-*)"
          test -d "${boost_root}"
          echo "BOOST_ROOT=${boost_root}" >> "${GITHUB_ENV}"

      - name: Download and verify prebuilt librime dependencies
        run: |
          curl -fLO "https://github.com/rime/librime/releases/download/${RIME_RELEASE_TAG}/${RIME_DEPS_ARCHIVE}"
          echo "${RIME_DEPS_SHA256}  ${RIME_DEPS_ARCHIVE}" | shasum -a 256 -c -
          tar -xjf "${RIME_DEPS_ARCHIVE}" -C librime

      - name: Install plugin into librime build tree
        run: |
          mkdir -p librime/plugins/llm-rerank
          git archive HEAD | tar -x -C librime/plugins/llm-rerank

      - name: Install model-free Python gates
        run: |
          python3 -m venv .venv-release
          .venv-release/bin/pip install "numpy==${NUMPY_PIN}" "pypinyin==${PYPINYIN_PIN}"

      - name: Run daemon and eval suites
        run: scripts/run-model-free-gates.sh .venv-release/bin/python

      - name: Configure
        working-directory: librime
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=$PWD/dist \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_MERGED_PLUGINS=OFF \
            -DENABLE_EXTERNAL_PLUGINS=ON \
            -DBUILD_TEST=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build plugin and C++ suite
        working-directory: librime
        run: |
          cmake --build build \
            --target rime-llm-rerank \
            --target llm_rerank_test \
            --target rime-llm-rerank-fact-store-tool \
            --target rime-predict \
            --target build_predict

      - name: Assert declared predict tool exists
        run: test -x librime/build/plugins/predict/bin/build_predict

      - name: Run C++ suite
        working-directory: librime/build
        run: ctest --output-on-failure -R '^llm_rerank_test$'

      - name: Verify artifact
        run: |
          PLUGIN=librime/build/lib/rime-plugins/librime-llm-rerank.dylib
          test -f "${PLUGIN}" || { echo "plugin dylib not built"; exit 1; }
          scripts/assert-universal-dylib.sh "${PLUGIN}"
          otool -L "${PLUGIN}" | grep -F "@rpath/librime.1.dylib (compatibility version 1.0.0, current version 1.17.0)" || \
            { echo "plugin not linked against librime 1.17.0"; exit 1; }
          shasum -a 256 "${PLUGIN}"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: librime/build/lib/rime-plugins/librime-llm-rerank.dylib
          fail_on_unmatched_files: true
